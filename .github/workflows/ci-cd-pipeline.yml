name: Offline integrity regression (not ZK proof verification)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q zkreg_gate.py tests/test_zkreg_gate.py
      - name: Real filesystem and subprocess regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust format and compilation (not a ZK verifier)
        run: |
          cargo fmt --check
          cargo check --locked
